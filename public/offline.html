<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f6f5f1">
    <title>Offline - Kasku</title>
    <script>
        (function () {
            try {
                var stored = localStorage.getItem('kasku-theme');
                if (stored === 'dark' || stored === 'light') {
                    document.documentElement.setAttribute('data-theme', stored);
                }
            } catch (e) {}
        })();
    </script>
    <style>
        :root {
            --paper: #f6f5f1;
            --card: #ffffff;
            --line: #e4e2db;
            --ink: #16181d;
            --muted: #5f6368;
            --accent: #0f7b5f;
            --accent-hover: #0c6650;
            --accent-ink: #ffffff;
            --focus: #0f7b5f;
            color-scheme: light;
        }

        @media (prefers-color-scheme: dark) {
            :root:not([data-theme='light']) {
                --paper: #111315;
                --card: #1a1d20;
                --line: #2a2e33;
                --ink: #eceae4;
                --muted: #9aa0a6;
                --accent: #276b55;
                --accent-hover: #22604c;
                --accent-ink: #eceae4;
                --focus: #3fa27f;
                color-scheme: dark;
            }
        }

        :root[data-theme='dark'] {
            --paper: #111315;
            --card: #1a1d20;
            --line: #2a2e33;
            --ink: #eceae4;
            --muted: #9aa0a6;
            --accent: #276b55;
            --accent-hover: #22604c;
            --accent-ink: #eceae4;
            --focus: #3fa27f;
            color-scheme: dark;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--paper);
            font-family: 'IBM Plex Sans', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            color: var(--ink);
            padding: 1.5rem;
        }

        .card {
            max-width: 22rem;
            width: 100%;
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 0.75rem;
            padding: 2rem 1.5rem;
            text-align: center;
        }

        .icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 3.5rem;
            height: 3.5rem;
            border: 1px solid var(--line);
            border-radius: 0.625rem;
            background: var(--paper);
            color: var(--ink);
            margin-bottom: 1rem;
        }

        .label {
            font-family: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            font-size: 0.6875rem;
            font-weight: 500;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            color: var(--muted);
            margin: 0 0 0.25rem;
        }

        h1 {
            font-size: 1.125rem;
            font-weight: 600;
            margin: 0 0 0.5rem;
        }

        p.description {
            font-size: 0.875rem;
            line-height: 1.5;
            color: var(--muted);
            margin: 0 0 1.5rem;
            padding-top: 1rem;
            border-top: 1px dashed var(--line);
        }

        button {
            width: 100%;
            min-height: 2.75rem;
            padding: 0.625rem 1rem;
            border: none;
            border-radius: 0.625rem;
            background: var(--accent);
            color: var(--accent-ink);
            font: inherit;
            font-size: 0.9375rem;
            font-weight: 600;
            cursor: pointer;
        }

        button:hover {
            background: var(--accent-hover);
        }

        button:focus-visible {
            outline: 2px solid var(--focus);
            outline-offset: 2px;
        }
    </style>
</head>
<body>
    <main class="card">
        <span class="icon" aria-hidden="true">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 20h.01" />
                <path d="M8.5 16.429a5 5 0 0 1 7 0" />
                <path d="M5 12.859a10 10 0 0 1 5.17-2.69" />
                <path d="M19 12.859a10 10 0 0 0-2.007-1.523" />
                <path d="M2 8.82a15 15 0 0 1 4.177-2.643" />
                <path d="M22 8.82a15 15 0 0 0-11.288-3.764" />
                <path d="m2 2 20 20" />
            </svg>
        </span>
        <p class="label">Tanpa koneksi</p>
        <h1>Kamu sedang offline</h1>
        <p class="description">Koneksi internet terputus. Halaman yang pernah kamu buka mungkin masih bisa diakses, tapi fitur chat butuh koneksi aktif.</p>
        <button type="button" onclick="location.reload()">Coba Lagi</button>
    </main>
</body>
</html>
